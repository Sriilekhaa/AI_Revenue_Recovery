services:
  # Backend API Service (FastAPI)
  - type: web
    name: recovery-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: "Recovery AI"
      - key: RAZORPAY_SIMULATION_MODE
        value: "true"

  # Frontend Web Service (React / Vite)
  - type: web
    name: recovery-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: recovery-ai-backend
          property: host
